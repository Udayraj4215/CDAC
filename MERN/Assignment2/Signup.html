<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Rethink+Sans:wght@800&display=swap"
        rel="stylesheet">
    <style>
        *{
            font-family:"Poppins", sans-serif;
            
        }
        body{
            background-image:url(./images/signup-photo.webp);
            background-repeat: no-repeat;
            background-position: center;
            background-attachment: fixed;
            background-size: cover;
        }
        #container{
            background-color: #ff6767;
            width: 400px;
            height: 450px;
            text-align: center;
            margin-bottom: 40px;
            margin: 80px auto;
            padding: 10px;
            border-radius: 25px;
            border: 1px;
            box-shadow: 5px 5px #3d382b;
        }
        #heading{
            
        }

        input{
            width: 70%;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 25px;
            border: none;
        }

        button{
            width: 35%;
            padding: 20px;
            background-color: #000000;
            border-radius: 50px;
            color: white;
            border: none;
        }
        a{
            text-decoration: none;
            color: rgb(255, 255, 255);
        }

        button a{
            color: aliceblue;
        }

        button:hover{
            background: rgb(255, 255, 255);
            transition: 0.4s ease-in;
        }
        a:hover{
            color: #000000;
        }

        p a{
            color: rgb(255, 255, 255);
        }
    </style>
</head>
<body>
    <div id="container">
        <h2 id="heading">Signup</h2>
        <form>
            <input type="text" placeholder="Enter your name">
            <input type="email" placeholder="Enter your email">
            <input type="password" placeholder="Enter your password">
            <button type="submit"><a href="./Home.html">Submit</a></button>
        </form>
        <p>Already have customer? <a href="./Signin.html">Log in</a></p>
    </div>
</body>
</html>
