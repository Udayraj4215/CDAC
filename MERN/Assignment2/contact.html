<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Rethink+Sans:wght@800&display=swap"
        rel="stylesheet">
        <link rel="preconnect" href="https://fonts.googleapis.com">
    <style>
        body{
            /* background-color: tomato; */
            font-family: "Rethink Sans", serif;
            background-image: url(./images/recipelist.webp);
        }
        .container {
            display: inline-block;
            text-align: center;
            margin-left: 300px;
            margin-top: 40px;
            background-color: rgb(255, 255, 255);
            padding:30px;
            border-radius: 20px;
        }
        label {
            margin-right: 40px; 
        }
        #name{
            margin-left: 30px; 
        }

        #email{
            margin-left: 30px;
        }

        #recipe{
            /* margin-right: 10px; */
            padding-right:10px;
        }
        .input-field {
            padding-bottom: 10px;
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }
        input {
            width: 60%;
        }
        textarea {
            width: 100%;
        }

        a{
            text-decoration: none;
            color: aliceblue;
        }
        button{
            width: 30%;
            margin-top: 30px;
            padding: 10px;
            border-radius: 50px;
            text-decoration: none;
            background-color: tomato;
            border-width: 0px;
        }

        img{
            position: absolute;
            
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Contact with us</h1>
        <p>Want to write a blog for this page? Contact us.....</p>

        <form action="">
            <div class="input-field">
                <label for="name">Name</label>
                <input type="text" id="name">
            </div>
            <div class="input-field">
                <label for="email">Email</label>
                <input type="email" id="email">
            </div>
            <div class="input-field">
                <label for="contact">Contact no</label>
                <input type="number" id="contact">
            </div>
            <div class="input-field">
                <label for="recipe">Recipename</label>
                <input type="text" id="recipe">
            </div>
            <div class="input-text">
                <label for="about">Write about yourself</label><br>
                <textarea id="about" cols="30"></textarea>
                <span>mandatory</span><span style="color: red;">*</span>
            </div>
            <button type="submit"><a href="./Home.html">Submit</a></button>
        </form>
    </div>
</body>
</html>
