<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="icon" href="./images/food.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Rethink+Sans:wght@800&display=swap"
        rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playwrite+GB+S:ital,wght@0,100..400;1,100..400&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Rethink+Sans:wght@800&display=swap"
        rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Moon+Dance&family=Playwrite+GB+S:ital,wght@1,100..400&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Rethink+Sans:wght@800&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            font-family: "Rethink Sans", serif;
        }

        nav {
            width: 100%;
            height: 90px;
            position: sticky;
            top: 0;
            background-color: aliceblue;

        }

        #logo {
            width: 55px;
            height: 60px;
            margin-top: 16px;
            margin-left: 10px;
            margin-right: 15px;
        }

        #nav-links {
            position: absolute;
            right: 40px;
            top: 40px;
        }

        #brand-name {
            position: absolute;
            top: 40px;
        }

        #nav-links a {
            margin-right: 40px;
            text-decoration: none;
            border-style: solid;
            color: black;
            padding: 10px;
            border-radius: 50px;
            transition: background-color 0.5 ease;
            border-color: rgb(72, 63, 51);
        }

        #nav-links a:hover {
            background-color: tomato;
            color: aliceblue;
            transition: background-color 0.4s ease;
        }

        .heading {
            /* background-color: blueviolet; */
            height: 150px;
            width: 500px;
            margin: 50px auto;
        }

        .heading p {
            width: 900px;
            /* font-family: "Playwrite GB S", cursive; */
        }

        #logo-names{
            font-family: "Moon Dance", cursive;
            font-weight: 1000;
            font-style: normal;
            margin: 2px;
        }


        .latest-div {
            width: 50px;
            height: 50px;
        }

        .image-container {
            display: flex;
            gap: 10px;
            justify-content: center;
            padding-bottom: 20px;
        }

        .footer {
            background-color: rgba(255, 99, 71, 0.193);
            height: 200px;

        }

        .footer-content {
            padding: 5px;

        }

        .link {
            text-decoration: none;
            color: gray;

        }

        .footer-img {
            width: 20px;
            padding: 20px;
        }

    </style>
</head>

<body>
    <nav>
        <a href="./Home.html"><img src="./images/food.png" id="logo"></a>
        <span id="brand-name">Food app</span>
        <div id="nav-links">
            <a href="./contact.html">Contact us</a>
            <a href="./Signin.html">Sign in</a>
            <a href="./Signup.html">Sign up</a>
            <a href="./aboutus.html">about us</a>
        </div>
    </nav>
    <header class="heading">
        <p>SIMPLE RECIPES MADE FOR REAL. <span id="logo-names"> ACTUAL. EVERYDAY. LIFE</span></p>
    </header>
    <section class="food-list">
        <div class="image-container">
            <img src="./images/Beet.jpg" alt="">
            <img src="./images/Black.jpg" alt="">
            <img src="./images/marryme.jpg" alt="">
            <img src="./images/sweetpotato.jpg" alt="">
        </div>
    </section>

    <footer class="footer">
        <hr class="hr">
        <ul>
            <li class="footer-content"><a class="link" href="./contactus.html">Contact us</a></li>
            <li class="footer-content"> <a class="link" href="blog.html">Blog</a></li>
            <li class="footer-content"><a href="" class="link">Recipe Index</a></li>
            <li class="footer-content"><a href="" class="link">Media Mentions</a></li>

        </ul>
        <div>
            <img src="./images/instagram.png" alt="" class="footer-img">
            <img src="./images/twitter.png" alt="" class="footer-img">
            <img src="./images/whatsapp.png" alt="" class="footer-img">
        </div>
    </footer>
</body>

</html>
